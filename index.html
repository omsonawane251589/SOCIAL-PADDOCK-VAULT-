<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Social Paddock Vault</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;color:#fff}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#080808 url("background.jpg") center/cover fixed no-repeat;
  position:relative;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;background:rgba(0,0,0,.38);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:0;
}
.card{
  position:relative;z-index:1;width:min(430px,100%);padding:30px 22px;
  border:1px solid rgba(255,255,255,.22);border-radius:30px;
  background:rgba(10,10,10,.48);
  backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
}
.card:before{
  content:"";position:absolute;left:18px;right:18px;top:10px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
}
h1{margin:0;text-align:center;font-size:29px;letter-spacing:.5px}
.sub{text-align:center;color:rgba(255,255,255,.72);margin:8px 0 25px}
a{
  display:flex;align-items:center;text-decoration:none;color:#fff;
  padding:16px 18px;margin:12px 0;border-radius:18px;
  border:1px solid rgba(255,255,255,.17);
  background:rgba(255,255,255,.095);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 22px rgba(0,0,0,.18);
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
}
a:hover{transform:translateY(-2px);background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
a:active{transform:scale(.985)}
.icon{display:inline-flex;align-items:center;justify-content:center;width:30px;font-size:20px;margin-right:4px}
.qr-wrap{
  margin:24px auto 8px;width:206px;padding:15px;border-radius:24px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 12px 30px rgba(0,0,0,.28);
}
.qr{padding:10px;background:#fff;border-radius:15px}
.qr img{display:block;width:100%;height:auto}
.qrtext{text-align:center;color:rgba(255,255,255,.74);font-size:13px;margin-top:11px}
.small{text-align:center;color:rgba(255,255,255,.48);font-size:12px;margin-top:20px}
@media(max-width:380px){body{padding:16px}.card{padding:26px 17px}h1{font-size:26px}}
</style>
</head>
<body>
<main class="card">
  <h1>SOCIAL PADDOCK VAULT</h1>
  <div class="sub">One vault. All my socials. 🔗🏁</div>

  <a href="https://www.snapchat.com/add/omunfiltered01">
    <span class="icon">👻</span> Snapchat
  </a>
  <a href="https://www.instagram.com/omsonawane2831">
    <span class="icon">📸</span> Instagram
  </a>
  <a href="https://wa.me/918055463579">
    <span class="icon">💬</span> WhatsApp
  </a>
  <a href="tel:+918055463579">
    <span class="icon">📞</span> Call me
  </a>
  <a href="mailto:omsonawanest819@gmail.com">
    <span class="icon">📧</span> Gmail
  </a>

  <div class="qr-wrap">
    <div class="qr">
      <img src="qr_code.png" alt="Scan QR Code">
    </div>
    <div class="qrtext">Scan to open Social Paddock Vault</div>
  </div>

  <div class="small">Scan • Tap • Connect</div>
</main>
</body>
</html>
